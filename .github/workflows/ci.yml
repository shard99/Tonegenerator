name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    # Pinned instead of 'ubuntu-latest', which is mid-migration from 24.04 to 26.04.
    # The image ships Android cmdline-tools 20.0, build-tools 37.0.0 and platform android-37.0.
    # x64 only: the arm64 variant does not include an Android SDK.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck

      - name: Build with Gradle
        run: ./gradlew assembleDebug
